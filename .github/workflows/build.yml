name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Jana projek
        run: |
          mkdir -p $RUNNER_TEMP/proj && cd $RUNNER_TEMP/proj
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.pvztouch"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.pvztouch2"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 4
                  versionName = "1.3"
              }
              signingConfigs {
                  create("fixed") {
                      storeFile = file("../fixed.keystore")
                      storePassword = "android"
                      keyAlias = "pvz"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  debug { signingConfig = signingConfigs.getByName("fixed") }
                  release { isMinifyEnabled = false; signingConfig = signingConfigs.getByName("fixed") }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="PvZ Touch"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/Theme.Game">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|density"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/bridge.js <<'EOF_FILE'
          (function () {
            if (window.__saveBridge) return;
            window.__saveBridge = true;

            function send(a) {
              const name = a.download || 'pvz-save.json';
              fetch(a.href).then(r => r.blob()).then(b => {
                const fr = new FileReader();
                fr.onload = () => {
                  const s = String(fr.result);
                  window.AndroidBridge.save(name, b.type || '', s.slice(s.indexOf(',') + 1));
                };
                fr.readAsDataURL(b);
              }).catch(() => {});
            }
            function handles(a) {
              return a && a.tagName === 'A' && window.AndroidBridge &&
                (a.hasAttribute('download') || /^(blob|data):/.test(a.href));
            }

            const origClick = HTMLAnchorElement.prototype.click;
            HTMLAnchorElement.prototype.click = function () {
              if (handles(this)) { send(this); return; }
              return origClick.apply(this, arguments);
            };
            const origDispatch = HTMLAnchorElement.prototype.dispatchEvent;
            HTMLAnchorElement.prototype.dispatchEvent = function (ev) {
              if (ev && ev.type === 'click' && handles(this)) { send(this); return true; }
              return origDispatch.apply(this, arguments);
            };
            document.addEventListener('click', function (e) {
              const a = e.target && e.target.closest ? e.target.closest('a') : null;
              if (handles(a)) { e.preventDefault(); e.stopImmediatePropagation(); send(a); }
            }, true);
          })();
          EOF_FILE
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/touch.js <<'EOF_FILE'
          (function () {
            if (window.__touchToMouse) return;
            window.__touchToMouse = true;

            const HOVER_DELAY = 60;     // jeda selepas gerak, sebelum tekan
            const CLICK_GAP = 40;       // jeda antara tekan dan lepas
            const MOVE_THRESHOLD = 10;  // piksel sebelum dikira skrol
            let down = false, lastTarget = null, twoFingerStart = 0;
            let startPt = null, lastPt = null, scroller = null, scrolling = false;
            let queue = Promise.resolve();
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            const run = fn => { queue = queue.then(fn).catch(() => {}); };
            const pt = t => ({ clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY });

            function target(t) {
              return document.elementFromPoint(t.clientX, t.clientY) || document.querySelector('canvas') || document.body;
            }
            // cari elemen DOM yang boleh diskrol (bukan canvas)
            function findScroller(el) {
              while (el && el.nodeType === 1 && el !== document.documentElement && el !== document.body) {
                if (el.tagName === 'CANVAS') return null;
                const cs = getComputedStyle(el);
                const oy = /(auto|scroll|overlay)/.test(cs.overflowY) && el.scrollHeight > el.clientHeight + 1;
                const ox = /(auto|scroll|overlay)/.test(cs.overflowX) && el.scrollWidth > el.clientWidth + 1;
                if (oy || ox) return el;
                el = el.parentElement;
              }
              return null;
            }
            function fire(type, t, button, buttons) {
              const el = (type === 'mouseup' || type === 'mousemove') && down && lastTarget ? lastTarget : target(t);
              el.dispatchEvent(new MouseEvent(type, {
                bubbles: true, cancelable: true, view: window,
                clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY,
                button: button, buttons: buttons
              }));
              return el;
            }
            function block(e) { e.preventDefault(); e.stopImmediatePropagation(); }

            window.addEventListener('touchstart', function (e) {
              block(e);
              if (e.touches.length === 2) { twoFingerStart = Date.now(); return; }  // 2 jari = klik kanan
              const t = pt(e.touches[0]);
              startPt = lastPt = { x: t.clientX, y: t.clientY };
              scrolling = false;
              scroller = findScroller(target(t));
              run(async () => {
                fire('mousemove', t, 0, 0);
                await sleep(HOVER_DELAY);
                lastTarget = fire('mousedown', t, 0, 1);
                down = true;
              });
            }, { capture: true, passive: false });

            window.addEventListener('touchmove', function (e) {
              block(e);
              if (e.touches.length > 1) return;
              const raw = e.touches[0];
              if (scroller) {
                const dx = raw.clientX - lastPt.x, dy = raw.clientY - lastPt.y;
                lastPt = { x: raw.clientX, y: raw.clientY };
                if (!scrolling && Math.hypot(raw.clientX - startPt.x, raw.clientY - startPt.y) > MOVE_THRESHOLD) scrolling = true;
                if (scrolling) {
                  scroller.scrollTop -= dy;
                  scroller.scrollLeft -= dx;
                  return;
                }
              }
              const t = pt(raw);
              run(async () => { fire('mousemove', t, 0, down ? 1 : 0); });
            }, { capture: true, passive: false });

            window.addEventListener('touchend', function (e) {
              block(e);
              const t = pt(e.changedTouches[0]);
              const isRight = twoFingerStart && Date.now() - twoFingerStart < 300 && e.touches.length === 0;
              const wasScrolling = scrolling;
              twoFingerStart = 0; scrolling = false; scroller = null;
              run(async () => {
                if (isRight) {
                  if (down) { fire('mouseup', t, 0, 0); down = false; lastTarget = null; }
                  fire('mousemove', t, 2, 0);
                  await sleep(HOVER_DELAY);
                  fire('mousedown', t, 2, 2); fire('mouseup', t, 2, 0); fire('contextmenu', t, 2, 0);
                  return;
                }
                if (!down) return;
                if (wasScrolling) {              // skrol: lepaskan tanpa klik
                  fire('mouseup', t, 0, 0);
                  down = false; lastTarget = null;
                  return;
                }
                fire('mousemove', t, 0, 1);
                await sleep(CLICK_GAP);
                fire('mouseup', t, 0, 0);
                fire('click', t, 0, 0);
                down = false; lastTarget = null;
              });
            }, { capture: true, passive: false });

            window.addEventListener('touchcancel', function (e) {
              const t = pt(e.changedTouches[0]);
              scrolling = false; scroller = null;
              run(async () => { if (down) { fire('mouseup', t, 0, 0); down = false; lastTarget = null; } });
            }, { capture: true, passive: false });

            window.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);
          })();
          EOF_FILE
          mkdir -p app/src/main/java/com/example/pvztouch
          cat > app/src/main/java/com/example/pvztouch/MainActivity.kt <<'EOF_FILE'
          package com.example.pvztouch

          import android.annotation.SuppressLint
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import android.util.Base64
          import android.view.View
          import android.view.WindowManager
          import android.webkit.JavascriptInterface
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import java.io.File

          private const val GAME_URL = "https://play.pvzge.com/"
          private const val DESKTOP_UA =
              "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          class Bridge(private val ctx: Context) {
              private fun toast(msg: String) =
                  Handler(Looper.getMainLooper()).post { Toast.makeText(ctx, msg, Toast.LENGTH_LONG).show() }

              @JavascriptInterface
              fun save(name: String, mime: String, b64: String) {
                  try {
                      val bytes = Base64.decode(b64, Base64.DEFAULT)
                      val safe = name.ifBlank { "pvz-save.json" }.replace(Regex("[\\\\/:*?\"<>|]"), "_")
                      if (Build.VERSION.SDK_INT >= 29) {
                          val values = ContentValues().apply {
                              put(MediaStore.Downloads.DISPLAY_NAME, safe)
                              put(MediaStore.Downloads.MIME_TYPE, if (mime.isBlank()) "application/octet-stream" else mime)
                              put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                          }
                          val uri = ctx.contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                              ?: throw RuntimeException("insert gagal")
                          ctx.contentResolver.openOutputStream(uri)?.use { it.write(bytes) }
                          toast("Disimpan dalam folder Download: $safe")
                      } else {
                          val dir = ctx.getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS)
                          File(dir, safe).writeBytes(bytes)
                          toast("Disimpan: ${File(dir, safe).absolutePath}")
                      }
                  } catch (e: Exception) {
                      toast("Gagal simpan: ${e.message}")
                  }
              }
          }

          class MainActivity : AppCompatActivity() {
              private lateinit var web: WebView
              private var injectJs: String = ""
              private var filePathCallback: ValueCallback<Array<Uri>>? = null

              private val chooser = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                  val result = WebChromeClient.FileChooserParams.parseResult(r.resultCode, r.data)
                  filePathCallback?.onReceiveValue(result)
                  filePathCallback = null
              }

              @Suppress("DEPRECATION")
              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  if (Build.VERSION.SDK_INT >= 28) {
                      window.attributes = window.attributes.also {
                          it.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      }
                  }

                  injectJs = listOf("bridge.js", "touch.js").joinToString("\n") { n ->
                      assets.open(n).bufferedReader().use { it.readText() }
                  }

                  web = WebView(this).apply {
                      setBackgroundColor(Color.BLACK)
                      setLayerType(View.LAYER_TYPE_HARDWARE, null)
                      overScrollMode = View.OVER_SCROLL_NEVER
                      isVerticalScrollBarEnabled = false
                      isHorizontalScrollBarEnabled = false
                      addJavascriptInterface(Bridge(this@MainActivity), "AndroidBridge")
                      settings.apply {
                          javaScriptEnabled = true
                          domStorageEnabled = true
                          databaseEnabled = true
                          cacheMode = WebSettings.LOAD_DEFAULT
                          mediaPlaybackRequiresUserGesture = false
                          userAgentString = DESKTOP_UA
                          useWideViewPort = true
                          loadWithOverviewMode = true
                          setSupportZoom(false)
                          builtInZoomControls = false
                          mixedContentMode = WebSettings.MIXED_CONTENT_NEVER_ALLOW
                      }
                      webChromeClient = object : WebChromeClient() {
                          override fun onShowFileChooser(
                              w: WebView, cb: ValueCallback<Array<Uri>>, p: FileChooserParams
                          ): Boolean {
                              filePathCallback?.onReceiveValue(null)
                              filePathCallback = cb
                              val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                                  addCategory(Intent.CATEGORY_OPENABLE)
                                  type = "*/*"
                              }
                              return try {
                                  chooser.launch(Intent.createChooser(intent, "Pilih fail"))
                                  true
                              } catch (e: Exception) {
                                  filePathCallback = null
                                  false
                              }
                          }
                      }
                      webViewClient = object : WebViewClient() {
                          override fun onPageStarted(v: WebView, url: String?, f: Bitmap?) {
                              v.evaluateJavascript(injectJs, null)
                          }
                          override fun onPageFinished(v: WebView, url: String?) {
                              v.evaluateJavascript(injectJs, null)
                              nudgeResize()
                          }
                      }
                  }
                  setContentView(web)
                  window.decorView.setOnSystemUiVisibilityChangeListener { vis ->
                      if (vis and View.SYSTEM_UI_FLAG_HIDE_NAVIGATION == 0) web.postDelayed({ immersive() }, 500)
                  }
                  web.loadUrl(GAME_URL)

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (web.canGoBack()) web.goBack() else finish()
                      }
                  })
              }

              @Suppress("DEPRECATION")
              private fun immersive() {
                  WindowInsetsControllerCompat(window, window.decorView).apply {
                      systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      hide(WindowInsetsCompat.Type.systemBars())
                  }
                  // cara lama, untuk EMUI/Huawei yang degil
                  window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      or View.SYSTEM_UI_FLAG_FULLSCREEN
                      or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY)
              }

              // suruh game kira semula saiz skrin selepas bar sistem disembunyikan
              private fun nudgeResize() {
                  val js = "window.dispatchEvent(new Event('resize'))"
                  for (d in longArrayOf(300, 1500, 4000, 8000)) {
                      web.postDelayed({ web.evaluateJavascript(js, null) }, d)
                  }
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) { immersive(); nudgeResize() }
              }
              override fun onResume() { super.onResume(); web.onResume(); immersive() }
              override fun onPause() { web.onPause(); super.onPause() }
              override fun onDestroy() { web.destroy(); super.onDestroy() }
          }
          EOF_FILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'EOF_FILE'
          <resources>
              <style name="Theme.Game" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > fixed.keystore.b64 <<'EOF_FILE'
          
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF_FILE
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "PvZTouch"
          include(":app")
          EOF_FILE
          base64 -d fixed.keystore.b64 > fixed.keystore
      - name: Build APK
        run: |
          cd $RUNNER_TEMP/proj
          gradle assembleDebug --no-daemon
      - name: Terbitkan APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp $RUNNER_TEMP/proj/app/build/outputs/apk/debug/app-debug.apk ./PvZTouch.apk
          gh release create "build-${{ github.run_number }}" ./PvZTouch.apk --repo "$GITHUB_REPOSITORY" --title "PvZ Touch #${{ github.run_number }}" --notes "APK debug"
